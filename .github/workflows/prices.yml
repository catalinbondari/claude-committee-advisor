name: Refresh prices

# Weekdays after the US close: fetch the latest Yahoo Finance prices, write them into the page,
# rebuild index.html and commit, which redeploys GitHub Pages.
on:
  schedule:
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance requests
      - run: python3 scripts/update_prices.py && python3 build.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add src/page.html index.html data/
          git diff --cached --quiet || (git commit -m "Prices: Yahoo Finance close $(date -u +%F)" && git push)
